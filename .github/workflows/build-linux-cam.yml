name: Build Linux ESP32-CAM (4MB Flash / 4MB PSRAM)

on:
  push:
    branches:
      - esp32-cam
      - cam
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-linux-cam-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile Linux, Rootfs and Bootloader for ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner resources
        run: |
          echo "CPU cores:"
          nproc
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bash bc bison build-essential bzip2 cmake cpio file \
            flex gawk git gperf help2man libncurses-dev libtool libtool-bin \
            libusb-1.0-0 m4 python3 python3-pip python3-venv rsync texinfo unzip wget \
            ca-certificates patch device-tree-compiler

      - name: Install esptool
        run: |
          sudo pip install --break-system-packages esptool
          esptool.py version

      - name: Setup Xtensa Toolchain & Dynconfig
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          echo "Downloading pre-compiled Xtensa FDPIC toolchain..."
          wget -q --retry-connrefused --waitretry=2 --read-timeout=30 --timeout=20 -t 5 \
            "https://github.com/wolfxalpha4/Linux-on-esp32-S3/releases/download/toolchain-v1/xtensa-esp32-all-toolchain.zip" \
            -O /tmp/toolchain.zip
          unzip -q /tmp/toolchain.zip -d "$GITHUB_WORKSPACE/toolchain"
          tar -xzf "$GITHUB_WORKSPACE/toolchain/xtensa-esp32s3-toolchain.tar.gz" -C "$GITHUB_WORKSPACE/toolchain"
          rm -f "$GITHUB_WORKSPACE/toolchain/xtensa-esp32s3-toolchain.tar.gz" /tmp/toolchain.zip

          # Make toolchain executables runnable
          chmod -R +x "$GITHUB_WORKSPACE/toolchain/bin"
          chmod -R +x "$GITHUB_WORKSPACE/toolchain/libexec"
          chmod -R +x "$GITHUB_WORKSPACE/toolchain/xtensa-esp32s3-linux-uclibcfdpic/bin"

          # Create xtensa-esp32-linux-uclibcfdpic symlinks
          for f in "$GITHUB_WORKSPACE/toolchain/bin"/xtensa-esp32s3-linux-uclibcfdpic-*; do
            ln -sf "$(basename "$f")" "${f/esp32s3/esp32}"
          done
          ln -sf xtensa-esp32s3-linux-uclibcfdpic "$GITHUB_WORKSPACE/toolchain/xtensa-esp32-linux-uclibcfdpic"

          # Also symlink into /opt for complete compatibility
          sudo mkdir -p /opt/xtensa-esp32s3-linux-uclibcfdpic
          sudo cp -a "$GITHUB_WORKSPACE/toolchain/esp32.so" /opt/xtensa-esp32s3-linux-uclibcfdpic/esp32.so
          sudo cp -a "$GITHUB_WORKSPACE/toolchain/esp32s3.so" /opt/xtensa-esp32s3-linux-uclibcfdpic/esp32s3.so

          mkdir -p "$GITHUB_WORKSPACE/xtensa-dynconfig"
          cp "$GITHUB_WORKSPACE/toolchain/esp32.so" "$GITHUB_WORKSPACE/xtensa-dynconfig/esp32.so"

          # Verify compiler with esp32 dynconfig overlay
          export XTENSA_GNU_CONFIG="$GITHUB_WORKSPACE/xtensa-dynconfig/esp32.so"
          "$GITHUB_WORKSPACE/toolchain/bin/xtensa-esp32-linux-uclibcfdpic-gcc" -v
          "$GITHUB_WORKSPACE/toolchain/bin/xtensa-esp32-linux-uclibcfdpic-gcc" -O2 -c -x c - -o /tmp/check_call0.o <<< "int foo(int a){return a+1;}"
          readelf -h /tmp/check_call0.o | grep "Flags:"

      - name: Build Buildroot Userspace and Kernel
        env:
          XTENSA_GNU_CONFIG: ${{ github.workspace }}/xtensa-dynconfig/esp32.so
          HOST_CFLAGS: -O2 -std=gnu17
          HOST_CXXFLAGS: -O2 -std=gnu17
          CFLAGS_FOR_BUILD: -O2 -std=gnu17
        run: |
          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchain"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"

          git clone https://github.com/jcmvbkbc/buildroot -b xtensa-2024.08-fdpic buildroot

          # Fix host-m4 compilation under GCC 14/15 (C23 nodiscard attribute syntax conflict in Gnulib)
          sed -i '/$(eval $(host-autotools-package))/i HOST_M4_CONF_ENV = CFLAGS="$(HOST_CFLAGS) -std=gnu17"' buildroot/package/m4/m4.mk

          mkdir -p build

          make -C buildroot O="$GITHUB_WORKSPACE/build" defconfig BR2_DEFCONFIG="$GITHUB_WORKSPACE/configs/esp32cam_4m_defconfig"
          buildroot/utils/config --file build/.config --set-str TOOLCHAIN_EXTERNAL_PATH "$TOOLCHAIN_DIR"
          buildroot/utils/config --file build/.config --set-str TOOLCHAIN_EXTERNAL_PREFIX '$(ARCH)-esp32-linux-uclibcfdpic'
          buildroot/utils/config --file build/.config --set-str TOOLCHAIN_EXTERNAL_CUSTOM_PREFIX '$(ARCH)-esp32-linux-uclibcfdpic'
          buildroot/utils/config --file build/.config --set-str ROOTFS_OVERLAY "$GITHUB_WORKSPACE/rootfs_overlay"
          buildroot/utils/config --file build/.config --set-str LINUX_KERNEL_CUSTOM_CONFIG_FILE "$GITHUB_WORKSPACE/configs/esp32cam_4m_linux.config"
          buildroot/utils/config --file build/.config --set-str BR2_PACKAGE_BUSYBOX_CONFIG "$GITHUB_WORKSPACE/configs/busybox.config"

          make -C buildroot O="$GITHUB_WORKSPACE/build" HOST_CFLAGS="-O2 -std=gnu17" HOST_CXXFLAGS="-O2 -std=gnu17" XTENSA_GNU_CONFIG="$GITHUB_WORKSPACE/xtensa-dynconfig/esp32.so" -j$(nproc)

          test -f build/images/xipImage
          test -f build/images/rootfs.cramfs
          ls -lh build/images/

      - name: Setup ESP-IDF for Bootloader
        run: |
          git clone --depth 1 -b v5.1.2 --recursive https://github.com/espressif/esp-idf.git "$GITHUB_WORKSPACE/esp-idf"
          "$GITHUB_WORKSPACE/esp-idf/install.sh" esp32

      - name: Build Bootloader and Partition Table
        run: |
          . "$GITHUB_WORKSPACE/esp-idf/export.sh"
          cd "$GITHUB_WORKSPACE/bootloader"
          cp "$GITHUB_WORKSPACE/configs/sdkconfig.defaults.esp32" sdkconfig.defaults
          cp "$GITHUB_WORKSPACE/configs/partitions.csv" partitions.csv
          idf.py set-target esp32
          idf.py build
          ls -lh build/bootloader/bootloader.bin
          ls -lh build/partition_table/partition-table.bin
          ls -lh build/linux_boot.bin

      - name: Package Flashable Images
        run: |
          chmod +x scripts/package-cam.sh
          ./scripts/package-cam.sh

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-esp32cam-4m-build
          path: images/
          if-no-files-found: error
          retention-days: 14
